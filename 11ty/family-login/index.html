<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sign in · Harrison Family</title>
  <!-- hfy-theme:start A -->
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#141210" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/source-sans-3-latin-wght-normal.7a19a702.woff2" />
  <!-- hfy-theme:end A -->
  <!-- hfy-theme:start B -->
  <link rel="stylesheet" href="/css/hfy-theme.css?v=00520cc3" />
  <!-- hfy-theme:end B -->
  <meta name="robots" content="noindex">
  <noscript><meta http-equiv="refresh" content="0; url=/auth/login"></noscript>
</head>
<body>
  <main class="hfy-page">
    <p class="hfy-page__note" role="status">taking you to sign in. <a href="/auth/login">sign in</a></p>
  </main>
  <script>
    // The retired Google sign-in page (HFY-TSK-317): old bookmarks land here and go straight to the edge sign-in, with ?next=<path>
    // carried over as returnTo. Same-origin path only (the edge's returnTo rule): one leading "/", no backslash or control
    // character, and never the sign-in pages themselves, which would loop. Anything else returns to "/".
    (function () {
      var to = "/";
      try {
        var next = new URLSearchParams(location.search).get("next");
        if (typeof next === "string" && next.length <= 2048 && next.charAt(0) === "/" && next.charAt(1) !== "/" &&
            !/[\\\u0000-\u001f\u007f]/.test(next) && !/^\/(auth|family-login)(\/|\?|#|$)/i.test(next)) to = next;
      } catch (e) { /* no query: return to "/" */ }
      location.replace("/auth/login?returnTo=" + encodeURIComponent(to));
    })();
  </script>
</body>
</html>
