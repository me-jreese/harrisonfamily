# retired by HFY-TSK-062
name: Deploy GCF (legacy)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: harrisonfamily
      GCF_REGION: us-west2
      GCF_FUNCTION: getAllowlist
      GCF_ENV_VARS: HFY_ALLOWLIST_SECRET=harrisonfamily-allowlist,GCP_PROJECT=harrisonfamily
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify gcloud authentication
        run: |
          gcloud config set project $GCP_PROJECT_ID
          gcloud auth list

      - name: Deploy Google Cloud Function
        run: |
          gcloud functions deploy $GCF_FUNCTION \
            --region=$GCF_REGION \
            --gen2 \
            --runtime=python311 \
            --source=functions/get-allowlist \
            --entry-point=get_allowlist \
            --trigger-http \
            --no-allow-unauthenticated \
            --set-env-vars=$GCF_ENV_VARS
