# @io-kit/ci 0.1.3 rendered — do not edit; sha256:7be1eec3576de9002c4a21b92af94a02f127a995b4c25c5383790cdfbce92ea1
name: io-kit CI
on:
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: io-kit-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/io-kit-ci/build
        env: &a1
          HFY_GOOGLE_CLIENT_ID: ${{ secrets.HFY_GOOGLE_CLIENT_ID }}
  test:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/io-kit-ci/test
  parity:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/io-kit-ci/build
        env: *a1
      - uses: ./.github/actions/io-kit-ci/parity-report
  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/io-kit-ci/secret-scan
