name: io-kit build
description: Run the manifest build command and verify the output directory exists.
inputs:
  cmd:
    description: Build command (build.cmd).
    default: bash scripts/ci/patch-client-id.sh && bash scripts/ci/package-lambda.sh
  out:
    description: Build output directory (build.out).
    default: 11ty
  node-version:
    description: Node version for actions/setup-node.
    default: "20"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Build
      shell: bash
      env:
        CMD: ${{ inputs.cmd }}
        OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        bash -c "$CMD"
        test -d "$OUT" || { echo "::error::build.out '$OUT' was not produced by the build command"; exit 1; }
