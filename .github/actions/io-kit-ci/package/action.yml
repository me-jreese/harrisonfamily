# @io-kit/ci 0.2.0 rendered — do not edit; sha256:758dde464a1e8bd528c4f6a9c235c1a4befeb7747d9d13ad0ba1d726efabec86
name: io-kit package
description: Upload the release artifact (build output, extra artifacts, release.json) named io-kit-release-<sha>; rollback redeploys it later.
inputs:
  out:
    description: Build output directory (build.out).
    default: 11ty
  artifacts:
    description: JSON array of extra artifact paths (artifacts).
    default: '["chat-worker/dist"]'
runs:
  using: composite
  steps:
    - name: Collect release paths
      id: paths
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        ARTIFACTS: ${{ inputs.artifacts }}
      run: |
        set -euo pipefail
        mkdir -p .io-kit-ci
        printf '{"sha":"%s","ref":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > .io-kit-ci/release.json
        {
          echo 'paths<<IOKIT_EOF'
          echo "$OUT"
          jq -r '.[]' <<<"$ARTIFACTS"
          echo '.io-kit-ci/release.json'
          echo 'IOKIT_EOF'
        } >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: io-kit-release-${{ github.sha }}
        path: ${{ steps.paths.outputs.paths }}
        if-no-files-found: error
        retention-days: 90
