# The chat Worker for harrisonfamily.us (HFY-PLN-002 chat.md sections 14.1 and 17; HFY-TSK-198).
#
# What lives where:
#   - `npm run build` bundles src/index.mjs into dist/ with `wrangler deploy --dry-run` and writes dist/deploy.json from this
#     file. dist/ is COMMITTED (HFY-R58): CI cannot install @io-kit/chat (no CodeArtifact read, HFY-R62) and installs no npm
#     package at CI time (HFY-R14). `npm run check` fails when dist/ is stale.
#   - CI uploads dist/ with curl and the scoped token (the cloudflare-worker target of @io-kit/ci). It verifies the routes
#     read-only and never creates them: the two routes below are created once by the orchestrator.
#   - Secrets are never in this file. CHAT_SERVICE_PRIVATE_KEY is set once with `wrangler secret put`; CI keeps it. CHAT_ADMIN_TOKEN
#     (the bearer token of POST /chat/v1/admin/expunge, HFY-TSK-337) is a second, separate secret set the same way (whether CI's upload keeps it is
#     checked at the first deploy); without it that route does not exist. It is never the service key and never a member session.
#   - Nothing here sets CHAT_WORKER_VERSION: CI injects the commit sha at upload, so the bundle is unchanged between merges.
name = "hfy-chat-worker"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = []

# The workers.dev hostname and preview URLs stay off for production: the only entrances are the two routes.
workers_dev = false
preview_urls = false

# The only two paths that leave CloudFront. /chat/ and /chat/index.html are pages and do not match either pattern.
routes = [
  { pattern = "harrisonfamily.us/chat/ws*", zone_name = "harrisonfamily.us" },
  { pattern = "harrisonfamily.us/chat/v1/*", zone_name = "harrisonfamily.us" },
]

# No platform log: a Worker log can hold request headers, and a header can hold the session cookie (PS-16).
# The hub's own log lines carry event names and counts only (a test pins that).
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[durable_objects]
bindings = [{ name = "CHAT_HUB", class_name = "ChatHub" }]

# Every Durable Object class is SQLite-backed. A class is never renamed or deleted: a delete migration destroys its data.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatHub"]

[vars]
SITE_ORIGIN = "https://harrisonfamily.us"
SESSION_ISSUER = "https://harrisonfamily.us/auth"
SESSION_AUDIENCE = "harrisonfamily-web"
SESSION_JWKS_URL = "https://harrisonfamily.us/auth/.well-known/jwks.json"
SESSION_COOKIE = "io_id"
# The kill switch. "0" closes every upgrade with 4503.
CHAT_ENABLED = "1"
# "uat" lets only CHAT_UAT_SUBJECTS connect, appear in the directory or receive pushes; the flip to "all" is a committed change.
CHAT_OPEN_TO = "uat"
# Comma-separated Gramps ids of io and the testers. Set at the first deploy; empty means nobody is let in.
CHAT_UAT_SUBJECTS = ""
API_BASE = "https://harrisonfamily.us/api"
CHAT_SERVICE_KID = "hfy-chat-1"
# Every Durable Object is created with this hint: an unhinted object landed in London in the spike (HFY-TSK-220).
CHAT_LOCATION_HINT = "wnam"

# ---------------------------------------------------------------------------------------------------------------------
# Staging: `wrangler deploy --env staging` (or `npm run staging:deploy`) on workers.dev, for the smoke script and the load
# tests. Nothing is inherited that matters: the Durable Object binding, its migration and the vars are declared again, and
# the script name differs, so the staging hub is a different Durable Object namespace with its own SQLite. It trusts a test
# JWKS (the TEST_JWKS var, generated by `npm run staging:keys`), never the production keys or data.
[env.staging]
name = "hfy-chat-worker-staging"
# The staging entry is the production wiring plus a test JWKS and a stand-in API (src/staging.mjs). Production's bundle has neither.
main = "src/staging.mjs"
workers_dev = true
preview_urls = false
routes = []

[env.staging.observability]
enabled = false

[env.staging.observability.logs]
enabled = false
invocation_logs = false

[env.staging.durable_objects]
bindings = [{ name = "CHAT_HUB", class_name = "ChatHub" }]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ChatHub"]

[env.staging.vars]
# A synthetic origin: the smoke script and the load harness send exactly this Origin.
SITE_ORIGIN = "https://chat-staging.test"
SESSION_ISSUER = "https://chat-staging.test/auth"
SESSION_AUDIENCE = "chat-staging-web"
SESSION_JWKS_URL = "https://chat-staging.test/auth/.well-known/jwks.json"
SESSION_COOKIE = "io_id"
CHAT_ENABLED = "1"
CHAT_OPEN_TO = "all"
CHAT_UAT_SUBJECTS = ""
# There is no origin behind workers.dev: a non-upgrade request answers 404 instead of fetching itself.
CHAT_PASSTHROUGH = "off"
CHAT_SERVICE_KID = "hfy-chat-staging-1"
CHAT_LOCATION_HINT = "wnam"
# The stand-in API (src/staging.mjs) answers the directory with this many synthetic members (I9001, I9002, ...), takes pushes
# and archive batches without storing them, and never touches the production API or DynamoDB. The archive mirror's CHAT# items
# are sampled against a stack that trusts the staging service key (docs/how-to/deploy-the-chat-worker.md).
API_BASE = "https://chat-staging.test/api"
STAGING_MEMBERS = "400"
# TEST_JWKS and CHAT_SERVICE_PRIVATE_KEY are added at deploy time: `npm run staging:deploy` generates a test key pair, keeps
# the private half in .staging/ (ignored by Git) and passes the public JWKS with --var and the service key as a secret.
