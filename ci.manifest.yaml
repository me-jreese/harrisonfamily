stack: static
branch: main
node_version: "22"
build:
  cmd: bash scripts/ci/patch-client-id.sh && bash scripts/ci/package-lambda.sh
  out: 11ty
  env:
    HFY_GOOGLE_CLIENT_ID: {secret: HFY_GOOGLE_CLIENT_ID}
artifacts:
  - dist/hfy-check-allowed.zip
tests:
  - bash scripts/ci/check-no-family-data.sh
  - bash scripts/infra/test/run.sh
  - if [ -d gramps/tests/unit ]; then python3 -m unittest discover gramps/tests/unit; else echo "no gramps/tests/unit yet; skipped"; fi
parity:
  mode: report
secrets_scan: trufflehog
deploy:
  aws_role_secret: AWS_DEPLOY_ROLE_TO_ASSUME
  region: us-west-2
  targets:
    - kind: s3_static
      bucket: harrisonfamily-frontend
      distribution: E2JCDK3QLQNNYB
      exclude:
        - "person/*.json"
        - "media/*"
        - "family/*"
        - "event/*"
        - "note/*"
        - "place/*"
        - "uploads/*"
        - "README.md"
      invalidate: ["/*"]
    - kind: lambda
      name: hfy-check-allowed
      zip: dist/hfy-check-allowed.zip
  smoke:
    - https://harrisonfamily.us/
    - https://harrisonfamily.us/family-login/
  rollback:
    strategy: previous_artifact
