stack: static
branch: main
node_version: "22"
build:
  cmd: echo "11ty/ is committed output; nothing to build"
  out: 11ty
tests:
  - bash scripts/ci/check-no-family-data.sh
  - bash scripts/infra/test/run.sh
  - if [ -d gramps/tests/unit ]; then python3 -m unittest discover gramps/tests/unit; else echo "no gramps/tests/unit yet; skipped"; fi
  - node --test 'scripts/ci/test/**/*.test.mjs'
  - node scripts/ci/check-client-licenses.mjs
  - node scripts/ci/check-sync-catalog.mjs
parity:
  mode: block
secrets_scan: trufflehog
deploy:
  aws_role_secret: AWS_DEPLOY_ROLE_TO_ASSUME
  region: us-west-2
  targets:
    - kind: s3_static
      bucket: harrisonfamily-frontend
      distribution: E2JCDK3QLQNNYB
      exclude:
        - "person/*.json"
        - "media/*"
        - "family/*"
        - "event/*"
        - "note/*"
        - "place/*"
        - "uploads/*"
        - "README.md"
      invalidate: ["/*"]
  smoke:
    - https://harrisonfamily.us/
    - https://harrisonfamily.us/family-login/
  rollback:
    strategy: previous_artifact
