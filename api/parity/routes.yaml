# UI route manifest for the hfy stack (@io-kit/parity routes schema 1.0.0). Handlers name the API routes (route registry names) the page calls;
# parity/map.yaml maps each MCP tool to the handler a human uses for the same action. Regenerate with the UI route generator when pages change.
schemaVersion: "1.0.0"
stack: hfy
surface: web
generatedAt: "2026-10-12T00:00:00Z"
routes:
  - path: /person/:id
    component: islands/comments
    handlers: ["api:comments.list", "api:comments.create", "api:comments.delete"]
    auth: { groups: [members] }
    surface: web
  - path: /posts
    component: islands/posts
    handlers: ["api:posts.list", "api:posts.get", "api:posts.create", "api:posts.delete"]
    auth: { groups: [members] }
    surface: web
  # HFY-TSK-211: the editing pages call the routes the MCP tools hfy_records_get, hfy_changes_submit, hfy_proposals_list and hfy_proposals_get mirror:
  # the record editor at /edit/ (HFY-TSK-212 and HFY-TSK-213; ?cls=&id=, flag recordEdit) and the suggestions page at /me/review/ (HFY-TSK-259). The routes sit behind HFY_EDITING.
  # Only the mirrored handlers are listed, as for the pages above. There is no api:proposals.decide here: the MCP surface has no decide tool (DEC-E5).
  - path: /edit/
    component: islands/editor
    handlers: ["api:edit.get", "api:changes.post"]
    auth: { groups: [members] }
    surface: web
  - path: /me/review/
    component: islands/review
    handlers: ["api:proposals.list", "api:proposals.get"]
    auth: { groups: [members] }
    surface: web
