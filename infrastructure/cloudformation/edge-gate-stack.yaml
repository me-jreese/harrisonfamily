AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  harrisonfamily private data gate (HFY-TSK-080, HFY-R63): Lambda@Edge viewer-request function that verifies the io_id edge
  session before person/family/event/note/place/media data is served. Lambda@Edge functions must live in us-east-1.
  Deploy order and rollback: cloudfront/README.md ("Private data gate").

Parameters:
  FunctionName: { Type: String, Default: hfy-edge-gate }
  CodeBucket: { Type: String, Description: "S3 bucket (in us-east-1) holding hfy-edge-gate.zip" }
  CodeKey: { Type: String, Default: lambda/hfy-edge-gate.zip }
  CodeSha256: { Type: String, Description: "Base64 SHA-256 of the zip, printed by scripts/ci/package-edge-gate.sh. A new value publishes a new Lambda version (the version is replaced; old ones are retained because CloudFront replicas pin them)" }

Rules:
  UsEast1Only:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: Lambda@Edge functions can only be created in us-east-1

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${FunctionName}-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: [lambda.amazonaws.com, edgelambda.amazonaws.com] }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Lambda@Edge writes to a log group named /aws/lambda/us-east-1.<function> in the region of the edge location that ran it.
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:/aws/lambda/us-east-1.${FunctionName}:*

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Description: Verifies the io_id edge session cookie (RS256, JWKS) for the private data paths
      Runtime: nodejs22.x
      Handler: index.handler
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt Role.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      # No Environment block: Lambda@Edge does not support environment variables. Config is baked into the zip.

  Version:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref Function
      CodeSha256: !Ref CodeSha256
      Description: !Sub "code ${CodeSha256}"

Outputs:
  EdgeGateVersionArn:
    Description: Qualified (versioned) ARN to associate as the viewer-request function (scripts/infra/add-data-gate-behaviors.sh reads this)
    Value: !Ref Version
  EdgeGateFunctionName: { Value: !Ref Function }
