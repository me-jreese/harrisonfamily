AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  harrisonfamily app backend (HFY-TSK-063, R32): DynamoDB table hfy-app, Lambda hfy-api behind an IAM-auth
  Function URL (AuthType NONE) used as a plain CloudFront custom origin, gated by the secret X-Origin-Verify header (HFY-R43).

Parameters:
  TableName: { Type: String, Default: hfy-app }
  FunctionName: { Type: String, Default: hfy-api }
  CodeBucket: { Type: String, Description: S3 bucket holding the hfy-api.zip package }
  CodeKey: { Type: String, Default: lambda/hfy-api.zip }
  ConfigBucket: { Type: String, Default: harrisonfamily, Description: Bucket with config/admins.json }
  MediaBucket: { Type: String, Default: harrisonfamily-frontend, Description: "Site bucket the API presigns post-photo uploads into (uploads/posts/*, never media/, which the ETL sync mirrors with --delete; HFY-R58) and reads person/<gramps_id>.json from for author display labels (read-only, HFY-R68). Not stack-managed: its CORS is a manual step, see site-bucket-cors.json" }
  MediaPublicBase: { Type: String, Default: "https://harrisonfamily.us", Description: "Origin that serves uploads/ (CloudFront /uploads/* behavior with UploadsResponseHeadersPolicy, scripts/infra/add-uploads-behavior.sh)" }
  AdminListKey: { Type: String, Default: config/admins.json }
  VapidSecretName: { Type: String, Default: "", Description: "Optional secret {subject,publicKey,privateKey} for web push; empty disables sending" }
  SessionIssuer: { Type: String, Default: "https://harrisonfamily.us/auth" }
  SessionAudience: { Type: String, Default: harrisonfamily-web }
  SessionJwksUrl: { Type: String, Default: "https://harrisonfamily.us/auth/.well-known/jwks.json", Description: Auth-edge JWKS the API verifies sessions with (HFY-R38; the API never holds the signing key) }
  SessionCookie: { Type: String, Default: io_id }
  GuardDob: { Type: String, Default: "off", AllowedValues: ["off", "on"], Description: "HFY_GUARD_DOB (privacy-guard-existing-paths): on refuses dob_not_allowed (a birth day or month near a birth word) on posts, comments and their MCP tools. Stays off until io's answer to Q2-17 line 5 is recorded; contact info is refused either way. A flip is a parameter-only change set (UsePreviousValue for every other parameter)" }
  # --- auth edge (HFY-TSK-062) ---
  AuthFunctionName: { Type: String, Default: hfy-auth-edge }
  AuthCodeKey: { Type: String, Default: lambda/hfy-auth-edge.zip, Description: Key of hfy-auth-edge.zip in CodeBucket }
  UserPoolName: { Type: String, Default: hfy-users }
  AllowlistKey: { Type: String, Default: config/userGrampsID.json, Description: Email -> gramps_id map the auth edge resolves principals against }
  SigningKeySecretName: { Type: String, Default: harrisonfamily/auth-edge/session-signing-key, Description: Secret created by scripts/infra/create-session-key.sh }
  McpRedirectUris: { Type: String, Default: "https://claude.ai/api/mcp/auth_callback,https://claude.com/api/mcp/auth_callback", Description: "HFY-TSK-076: comma-separated exact redirect URIs the public MCP client may use (the only allowed list)" }
  McpResources: { Type: String, Default: "https://harrisonfamily.us/mcp", Description: "HFY-TSK-076: comma-separated resource indicators (token aud); the first is the default" }
  McpCorsOrigins: { Type: String, Default: "https://claude.ai,https://claude.com", Description: "Exact browser origins allowed CORS on /auth/token, /register, /revoke (never a wildcard)" }
  SyncDesktopClient: { Type: String, Default: "0", AllowedValues: ["0", "1"], Description: "HFY-TSK-120 stack switch (default off): 1 registers the hfy-sync-desktop OAuth client (Gramps desktop add-on) on the auth edge. Turn on in the same change set as the sync routes (AC6 RG-4)" }
  TurnstileSecretName: { Type: String, Default: harrisonfamily/auth-edge/turnstile, Description: "Secret holding the Turnstile secret key; created by io in Secrets Manager" }
  AccessRequestPepperSecretName: { Type: String, Default: harrisonfamily/access-request/pepper, Description: "Secret holding the HMAC pepper for access-request email hashes" }
  OriginVerifySecretName: { Type: String, Default: harrisonfamily/cloudfront/origin-verify, Description: "Secret created by scripts/infra/create-origin-verify.sh; CloudFront sends it as X-Origin-Verify (HFY-R43)" }
  GoogleClientId: { Type: String, Description: Google OAuth web client id for GIS sign-in (public value) }
  SesIdentityArn: { Type: String, Default: "", Description: "Optional verified SES identity ARN (for example harrisonfamily.us, same region) for Cognito email. Empty keeps COGNITO_DEFAULT (about 50 emails/day for the account); the edge rate-limits /auth/password/forgot per email+IP either way" }
  SesFromAddress: { Type: String, Default: "", AllowedPattern: "^$|^[^<>\\s]+@[^<>\\s]+$", Description: "Optional bare From address when SesIdentityArn is set, for example: no-reply@harrisonfamily.us. Bare because the ses:FromAddress condition on the SendEmail grants compares it exactly (a display-name form never matches). SesConfigurationSet and SesIdentityArn each require it, see Rules" }

  # --- W2/W3 (HFY-TSK-247, BRD2 10.2 item 8): every default-off parameter lands in this one change set; later changes are parameter-only ---
  SyncBucketName: { Type: String, Default: harrisonfamily-sync, Description: "Stack-managed private bucket for snapshots/, render-shadow/ and render/ (BRD2 section 8)" }
  RenderFunctionName: { Type: String, Default: hfy-sync-render }
  GraphRenderFunctionName: { Type: String, Default: hfy-graph-render }
  SyncApiEnabled: { Type: String, Default: "0", AllowedValues: ["0", "1"], Description: "Desktop-only stop for /api/sync/* (env SYNC_API_ENABLED). 0 answers 404 not_enabled" }
  RenderMode: { Type: String, Default: "off", AllowedValues: ["off", "shadow", "live"], Description: "hfy-sync-render mode (env RENDER_MODE). off is the primary rollback" }
  RenderCodeKey: { Type: String, Default: lambda/hfy-sync-render-placeholder.zip, Description: "Key of the hfy-sync-render package in CodeBucket. The placeholder is a no-op under RENDER_MODE=off" }
  GraphRenderCodeKey: { Type: String, Default: lambda/hfy-graph-render-placeholder.zip, Description: "Key of the hfy-graph-render package in CodeBucket. The placeholder is a no-op that nothing invokes (review DL-34)" }
  HfyEditing: { Type: String, Default: "off", AllowedValues: ["off", "on"], Description: "Editing routes switch (env HFY_EDITING). While off they answer 404 not_found" }
  AccessRequests: { Type: String, Default: "off", AllowedValues: ["off", "on"], Description: "Access-request intake kill switch on the auth edge (env ACCESS_REQUESTS)" }
  TurnstileSiteKey: { Type: String, Default: "", Description: "Public Cloudflare Turnstile site key (env TURNSTILE_SITE_KEY); not a secret" }
  SesConfigurationSet: { Type: String, Default: "", Description: "Optional SES configuration set name for the hfy-api notification mail (env SES_CONFIGURATION_SET on hfy-api). Access-request mail from the auth edge uses the Join* parameters below, never this one" }
  # HFY-TSK-195 (ruling P2-R23, review PS-25): access-request mail has its OWN SES identity (the join subdomain, with its own MAIL FROM subdomain),
  # configuration set and bounce and complaint alarms, so abuse of the join flow can never pause Cognito's password-reset mail or the API's mail.
  JoinSesIdentityArn: { Type: String, Default: "", Description: "Verified SES identity ARN of the join subdomain (same region) that sends the access-request mail from the auth edge (env: none, the grant only). Empty leaves the edge without a SendEmail grant, so the code route answers 503 unavailable" }
  JoinFromAddress: { Type: String, Default: "", AllowedPattern: "^$|^[^<>\\s]+@[^<>\\s]+$", Description: "Bare From address on the join identity, for example: no-reply@join.example.test (env JOIN_FROM_ADDRESS). Bare because the ses:FromAddress condition on the grant compares it exactly" }
  JoinSesConfigurationSet: { Type: String, Default: "", Description: "SES configuration set for access-request mail only: no open or click tracking, bounce and complaint feedback (env JOIN_SES_CONFIGURATION_SET). Required whenever JoinSesIdentityArn is set, and the code route answers 503 unavailable without it" }
  JoinBounceAlarmName: { Type: String, Default: hfy-ses-access-request-bounce-rate, Description: "CloudWatch alarm on the join configuration set's bounce rate. The edge reads its state (cloudwatch:DescribeAlarms) and answers 503 unavailable on the code route while it is in ALARM, or if the alarm does not exist" }
  JoinComplaintAlarmName: { Type: String, Default: hfy-ses-access-request-complaint-rate, Description: "CloudWatch alarm on the join configuration set's complaint rate; read like JoinBounceAlarmName" }
  ChatServicePublicKeys: { Type: String, Default: "", Description: "JSON array of {kid, spki} chat-worker service public keys (env CHAT_SERVICE_PUBLIC_KEYS); public, so not a secret. Empty makes the chat service routes answer 503" }
  AlarmEmail: { Type: String, Default: "", Description: "Address subscribed to the alarm topic (io). Empty creates the topic without a subscription. The subscription is confirmed from the email it sends" }
  BreakGlassPrincipalArn: { Type: String, AllowedPattern: "^arn:aws[a-z-]*:iam::[0-9]{12}:(user|role)/.+$", Description: "IAM user or role (io) allowed to assume hfy-data-breakglass with MFA. Compared by ARN in a condition, so the role survives the principal being recreated" }

Rules:
  SesConfigurationSetNeedsIdentity:
    RuleCondition: !Not [!Equals [!Ref SesConfigurationSet, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref SesIdentityArn, ""]]
        AssertDescription: SesConfigurationSet requires SesIdentityArn (the SendEmail grant exists only when an identity is set)
  SesIdentityNeedsFromAddress:
    RuleCondition: !Not [!Equals [!Ref SesIdentityArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref SesFromAddress, ""]]
        AssertDescription: SesIdentityArn requires SesFromAddress (the SendEmail grant is conditioned on it)
  JoinSesIdentityNeedsFromAddress:
    RuleCondition: !Not [!Equals [!Ref JoinSesIdentityArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref JoinFromAddress, ""]]
        AssertDescription: JoinSesIdentityArn requires JoinFromAddress (the SendEmail grant is conditioned on it)
  JoinSesIdentityNeedsConfigurationSet:
    RuleCondition: !Not [!Equals [!Ref JoinSesIdentityArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref JoinSesConfigurationSet, ""]]
        AssertDescription: JoinSesIdentityArn requires JoinSesConfigurationSet (access-request mail without its own configuration set sends no bounce or complaint feedback, so the alarm gate would watch nothing; the code route fails closed without it)
  JoinSesConfigurationSetNeedsIdentity:
    RuleCondition: !Not [!Equals [!Ref JoinSesConfigurationSet, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref JoinSesIdentityArn, ""]]
        AssertDescription: JoinSesConfigurationSet requires JoinSesIdentityArn (the SendEmail grant exists only when the join identity is set)

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasSesConfigSet: !Not [!Equals [!Ref SesConfigurationSet, ""]]
  HasVapid: !Not [!Equals [!Ref VapidSecretName, ""]]
  HasSes: !Not [!Equals [!Ref SesIdentityArn, ""]]
  HasSesFrom: !And [!Condition HasSes, !Not [!Equals [!Ref SesFromAddress, ""]]]
  HasJoinSes: !Not [!Equals [!Ref JoinSesIdentityArn, ""]]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
      # HFY-TSK-247: the change-log stream feeds hfy-sync-render. KEYS_ONLY: the renderer re-reads the store, so no item data leaves the table.
      StreamSpecification: { StreamViewType: KEYS_ONLY }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: 30

  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${FunctionName}-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: hfy-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*
              - Sid: Table
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan, dynamodb:BatchGetItem, dynamodb:BatchWriteItem, dynamodb:ConditionCheckItem]
                Resource: [!GetAtt Table.Arn, !Sub "${Table.Arn}/index/*"]
              # HFY-TSK-178: the record-change fan-out reads the table stream (the RecordFanoutMapping below). Read-only, this table's stream only.
              - Sid: RecordFanoutStream
                Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator]
                Resource: !GetAtt Table.StreamArn
              - Sid: AdminList
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ConfigBucket}/config/*
              # HFY-R58 (2): member uploads live under uploads/posts/<ulid>/ only; media/ belongs to the ETL sync (--delete).
              - Sid: PostPhotoUploads
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/uploads/posts/*
              # HFY-TSK-236 (BRD2 10.3): comment photos upload under uploads/comments/ only; never media/ or config/.
              - Sid: CommentPhotoUploads
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/uploads/comments/*
              # HFY-TSK-236: HEAD (size and type check) and copy source need s3:GetObject on the upload prefixes only.
              - Sid: UploadReads
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/uploads/comments/*
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/uploads/posts/*
              # HFY-R68: author labels are the person's displayName from the site's own record (never the allowlist email). Read-only, person/* only.
              - Sid: PersonRecords
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/person/*
              # HFY-TSK-247: desktop media presign (PutObject) and comment-photo graduation (GetObject source, PutObject destination)
              # under media/*, which also covers hfy-graduate-api. The bucket-policy deny on media/*.json (cutover) leaves binaries to this role only.
              # HFY-TSK-173: DeleteObject removes a finalized blob's media/.staging/<handle>/<sha256> object and the binary an extension change
              # orphaned (media/<handle><old ext>). The sync code deletes only those two shapes of key (api/src/sync/media.js); BRD2 11.4 lists this
              # role as the one principal besides the renderers that may delete under media/* after the cutover deny.
              - Sid: MediaBinaries
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/media/*
              # HFY-TSK-247: change snapshots (snapshots/<seq>.jsonl.gz, latest.json) in the sync bucket; nothing else there.
              - Sid: SyncSnapshots
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub arn:${AWS::Partition}:s3:::${SyncBucketName}/snapshots/*
              - !If
                - HasSes
                - Sid: SendEmail
                  Effect: Allow
                  Action: ses:SendEmail
                  Resource:
                    - !Ref SesIdentityArn
                    - !If [HasSesConfigSet, !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${SesConfigurationSet}", !Ref "AWS::NoValue"]
                  Condition:
                    StringEquals: { "ses:FromAddress": !Ref SesFromAddress }
                - !Ref "AWS::NoValue"
              - !If
                - HasVapid
                - Sid: Secrets
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${VapidSecretName}-*
                - !Ref AWS::NoValue

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Handler: src/index.handler
      Role: !GetAtt Role.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          SESSION_JWKS_URL: !Ref SessionJwksUrl
          ORIGIN_VERIFY: !Sub "{{resolve:secretsmanager:${OriginVerifySecretName}:SecretString}}"
          SESSION_ISSUER: !Ref SessionIssuer
          SESSION_AUDIENCE: !Ref SessionAudience
          SESSION_COOKIE: !Ref SessionCookie
          ADMIN_LIST_BUCKET: !Ref ConfigBucket
          ADMIN_LIST_KEY: !Ref AdminListKey
          MEDIA_BUCKET: !Ref MediaBucket
          MEDIA_PUBLIC_BASE: !Ref MediaPublicBase
          HFY_GUARD_DOB: !Ref GuardDob
          VAPID_SECRET: !If [HasVapid, !Ref VapidSecretName, !Ref "AWS::NoValue"]
          SYNC_API_ENABLED: !Ref SyncApiEnabled
          HFY_EDITING: !Ref HfyEditing
          CHAT_SERVICE_PUBLIC_KEYS: !Ref ChatServicePublicKeys
          SYNC_BUCKET: !Ref SyncBucketName
          SES_FROM_ADDRESS: !Ref SesFromAddress
          SES_CONFIGURATION_SET: !Ref SesConfigurationSet

  # HFY-TSK-178 (hfy-record-change-fanout; BRD2 D2-02, review SI-20): record-change notifications come from the render outbox only. The renderer
  # writes SYNC#RENDERED/<seq> in its live passes; this mapping wakes hfy-api for each insert (KEYS_ONLY stream: the consumer reads the item back).
  # Nothing is inserted while RenderMode is off or shadow, and delivery is gated per recipient by the recordSubsV1 flag, so the mapping is inert
  # until the cutover and the flag. A failed record is retried 3 times and then dropped (delivery is a nicety; the dedupe claims make a replay by
  # `aws lambda invoke --payload '{"source":"record-fanout","seq":N}'` safe).
  RecordFanoutMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref Function
      EventSourceArn: !GetAtt Table.StreamArn
      StartingPosition: LATEST
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
      MaximumRetryAttempts: 3
      FunctionResponseTypes: [ReportBatchItemFailures]
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName":["INSERT"],"dynamodb":{"Keys":{"PK":{"S":["SYNC#RENDERED"]}}}}'

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  # AuthType NONE: the URL is publicly invokable, so each Lambda rejects any request without the X-Origin-Verify secret (HFY-R43).
  InvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  InvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # HFY-R58 (2): attached to the CloudFront /uploads/* behavior by scripts/infra/add-uploads-behavior.sh (the public state, and what
  # add-data-gate-behaviors.sh --remove restores; the gated behavior uses hfy-uploads-private, same headers plus Cache-Control
  # private, no-store). Member uploads are served same-origin, so they are forced inert: no MIME sniffing, and a sandboxed CSP
  # that allows nothing but same-origin images.
  UploadsResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${FunctionName}-uploads-sandbox
        Comment: "harrisonfamily /uploads/*: nosniff + sandboxed CSP for member uploads (HFY-R58)"
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          ContentSecurityPolicy:
            ContentSecurityPolicy: "sandbox; default-src 'none'; img-src 'self'"
            Override: true

  # ---------------- auth edge (HFY-TSK-062): Cognito pool + hfy-auth-edge at https://harrisonfamily.us/auth/* ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Ref UserPoolName
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      # HFY-R58 (5): no public SignUp. The edge provisions users with AdminCreateUser, and only after the allowlist check,
      # so a client-id holder cannot pre-register a family member's email with their own password.
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      # A changed email stays unverified (and the old one stays in effect) until the new address confirms its code.
      UserAttributeUpdateSettings: { AttributesRequireVerificationBeforeUpdate: [email] }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
      VerificationMessageTemplate: { DefaultEmailOption: CONFIRM_WITH_CODE }
      # COGNITO_DEFAULT caps account-wide email at about 50/day; set SesIdentityArn to send through SES instead (cognito-default-email-quota).
      EmailConfiguration: !If
        - HasSes
        - EmailSendingAccount: DEVELOPER
          SourceArn: !Ref SesIdentityArn
          From: !If [HasSesFrom, !Ref SesFromAddress, !Ref "AWS::NoValue"]
        - EmailSendingAccount: COGNITO_DEFAULT

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: hfy-web
      GenerateSecret: false
      # The edge, not the browser, calls Cognito (InitiateAuth USER_PASSWORD_AUTH) and then mints its own RS256 session.
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: [COGNITO]
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits: { RefreshToken: days, AccessToken: minutes, IdToken: minutes }

  AuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AuthFunctionName}
      RetentionInDays: 30

  AuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AuthFunctionName}-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: hfy-auth-edge
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AuthFunctionName}:*
              - Sid: RefreshAndLinkStore
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: [!GetAtt Table.Arn, !Sub "${Table.Arn}/index/*"]
              - Sid: Allowlist
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ConfigBucket}/${AllowlistKey}
                  - !Sub arn:${AWS::Partition}:s3:::${ConfigBucket}/${AdminListKey}
              - Sid: SigningKey
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SigningKeySecretName}-*
              # The pool is AdminCreateUserOnly: auth/src/cognito.js creates users (after the allowlist check) and repairs any
              # pre-lockdown self-signed-up user (AdminConfirmSignUp, email_verified via AdminUpdateUserAttributes).
              - Sid: CognitoAdminLink
                Effect: Allow
                Action: [cognito-idp:AdminGetUser, cognito-idp:AdminCreateUser, cognito-idp:AdminSetUserPassword, cognito-idp:AdminConfirmSignUp, cognito-idp:AdminUpdateUserAttributes]
                Resource: !GetAtt UserPool.Arn
              # HFY-TSK-247 (BRD2 section 9, surfaces): the anonymous access-request routes read the Turnstile secret and the pepper that hashes emails.
              - Sid: AccessRequestSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${TurnstileSecretName}-*
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AccessRequestPepperSecretName}-*
              # HFY-TSK-195: access-request mail is sent only from the JOIN identity and its configuration set. The edge has no grant on the
              # Cognito and API identity (Cognito sends its own mail through the user pool's EmailConfiguration, not through this role).
              - !If
                - HasJoinSes
                - Sid: SendEmail
                  Effect: Allow
                  Action: ses:SendEmail
                  Resource:
                    - !Ref JoinSesIdentityArn
                    - !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${JoinSesConfigurationSet}" # required whenever the identity is set (rule JoinSesIdentityNeedsConfigurationSet)
                  Condition:
                    StringEquals: { "ses:FromAddress": !Ref JoinFromAddress }
                - !Ref "AWS::NoValue"
              # The code route reads the state of the bounce and complaint alarms and stops while either is in ALARM (review PS-25).
              # DescribeAlarms is a list-style call and AWS may not honor an alarm-ARN Resource for it (an AccessDenied would fail the gate
              # closed, so the code route would answer 503 for good). Resource "*" is therefore used; the route asks for the two alarm names
              # only (JOIN_MAIL_ALARMS), and the grant is read-only alarm metadata. The real IAM behavior is checked by the RG-4 route smoke.
              - Sid: JoinMailAlarmState
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"

  AuthFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuthLogGroup
    Properties:
      FunctionName: !Ref AuthFunctionName
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 15
      Handler: src/index.handler
      Role: !GetAtt AuthRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref AuthCodeKey }
      Environment:
        Variables:
          AUTH_TABLE: !Ref TableName
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          MCP_REDIRECT_URIS: !Ref McpRedirectUris
          MCP_RESOURCES: !Ref McpResources
          MCP_CORS_ORIGINS: !Ref McpCorsOrigins
          HFY_SYNC_DESKTOP_CLIENT: !Ref SyncDesktopClient
          ORIGIN_VERIFY: !Sub "{{resolve:secretsmanager:${OriginVerifySecretName}:SecretString}}"
          ADMIN_LIST_KEY: !Ref AdminListKey
          ACCESS_REQUESTS: !Ref AccessRequests
          TURNSTILE_SITE_KEY: !Ref TurnstileSiteKey
          TURNSTILE_SECRET_NAME: !Ref TurnstileSecretName
          ACCESS_REQUEST_PEPPER_SECRET: !Ref AccessRequestPepperSecretName
          JOIN_FROM_ADDRESS: !Ref JoinFromAddress
          JOIN_SES_CONFIGURATION_SET: !Ref JoinSesConfigurationSet
          JOIN_MAIL_ALARMS: !Sub "${JoinBounceAlarmName},${JoinComplaintAlarmName}"

  AuthFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AuthFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  AuthInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AuthInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------------- sync + render (HFY-TSK-247, BRD2 sections 8 and 11): bucket, renderer, schedule, alarms, break-glass ----------------
  # Private, versioned, SSE-S3. snapshots/ expire after 30 days; noncurrent versions of snapshots/ and render-shadow/ expire after
  # 1 day and expired delete markers go, so an expunge (PS-05) leaves no versioned copy behind.
  SyncBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref SyncBucketName
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - { Id: snapshots-current-30d, Status: Enabled, Prefix: snapshots/, ExpirationInDays: 30 }
          - Id: snapshots-noncurrent-1d
            Status: Enabled
            Prefix: snapshots/
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
            ExpiredObjectDeleteMarker: true
          - Id: render-shadow-noncurrent-1d
            Status: Enabled
            Prefix: render-shadow/
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
            ExpiredObjectDeleteMarker: true
          - { Id: abort-incomplete-multipart, Status: Enabled, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 } }

  SyncBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SyncBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SyncBucket.Arn, !Sub "${SyncBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${FunctionName}-alarms

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # Not CMK-encrypted on purpose: CloudWatch alarms can publish only to a topic whose key policy admits cloudwatch.amazonaws.com.
  RenderDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${RenderFunctionName}-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  RenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${RenderFunctionName}
      RetentionInDays: 30

  RenderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${RenderFunctionName}-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: hfy-sync-render
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${RenderFunctionName}:*
              - Sid: TableRead
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:BatchGetItem]
                Resource: [!GetAtt Table.Arn, !Sub "${Table.Arn}/index/*"]
              # The renderer writes only its own cursor and rendered markers; REC# heads and the append-only SYNC#LOG are read-only to it.
              - Sid: TableWrite
                Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:BatchWriteItem, dynamodb:ConditionCheckItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringEquals: { "dynamodb:LeadingKeys": ["SYNC#RENDER", "SYNC#RENDERED"] }
              - Sid: Stream
                Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator]
                Resource: !GetAtt Table.StreamArn
              - Sid: Dlq
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RenderDlq.Arn
              - Sid: SyncBucketObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${SyncBucketName}/snapshots/*
                  - !Sub arn:${AWS::Partition}:s3:::${SyncBucketName}/render-shadow/*
                  - !Sub arn:${AWS::Partition}:s3:::${SyncBucketName}/render/*
              - Sid: SyncBucketList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SyncBucket.Arn
                Condition:
                  StringLike: { "s3:prefix": ["snapshots/*", "render-shadow/*", "render/*"] }
              # The rendered data keys only (BRD2 section 8). person/index.html and the other public shell files are not renderer-owned.
              - Sid: RenderedData
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/person/*.json
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/family/*.json
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/event/*.json
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/note/*.json
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/place/*.json
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/media/*.json
              - Sid: RenderedDataList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${MediaBucket}
                Condition:
                  StringLike:
                    "s3:prefix": ["media/tree_*", "person/*", "family/*", "event/*", "note/*", "place/*"]
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: { StringEquals: { "cloudwatch:namespace": HFY/SyncRender } }

  # No-op under RENDER_MODE=off until render-lambda ships a real package under the same key parameter.
  RenderFunction:
    Type: AWS::Lambda::Function
    DependsOn: RenderLogGroup
    Properties:
      FunctionName: !Ref RenderFunctionName
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Handler: handler.handler
      Role: !GetAtt RenderRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref RenderCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          SYNC_BUCKET: !Ref SyncBucketName
          SITE_BUCKET: !Ref MediaBucket
          RENDER_MODE: !Ref RenderMode
          METRICS_NAMESPACE: HFY/SyncRender

  RenderStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref RenderFunction
      EventSourceArn: !GetAtt Table.StreamArn
      StartingPosition: LATEST
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 5
      MaximumRetryAttempts: 5
      BisectBatchOnFunctionError: true
      FunctionResponseTypes: [ReportBatchItemFailures]
      FilterCriteria:
        Filters:
          - Pattern: '{"dynamodb":{"Keys":{"PK":{"S":["SYNC#LOG"]}}}}'
      DestinationConfig:
        OnFailure: { Destination: !GetAtt RenderDlq.Arn }

  # Every 15 minutes the renderer is invoked; it exits at once unless SYNC#RENDER.rendered_seq < SYNC#HEAD.seq (and RENDER_MODE is not off).
  RenderSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: "hfy-sync-render catch-up while rendered_seq < head seq (abandoned push sessions, stream gaps)"
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - { Id: render, Arn: !GetAtt RenderFunction.Arn, Input: '{"source":"schedule"}' }

  RenderSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RenderFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RenderSchedule.Arn

  DlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${RenderFunctionName}-dlq-depth
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt RenderDlq.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  RenderErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${RenderFunctionName}-RenderError
      Namespace: HFY/SyncRender
      MetricName: RenderError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  RenderPrivacyBlockAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${RenderFunctionName}-RenderPrivacyBlock
      Namespace: HFY/SyncRender
      MetricName: RenderPrivacyBlock
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  MassDeleteGuardAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${RenderFunctionName}-MassDeleteGuard
      Namespace: HFY/SyncRender
      MetricName: MassDeleteGuard
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  HeadMismatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${RenderFunctionName}-HeadMismatch
      Namespace: HFY/SyncRender
      MetricName: HeadMismatch
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Review DL-34: the graph renderer's function, role and code-key parameter land now (placeholder package, nothing invokes it) so the
  # RG-6 change set that ships the real package is parameter-only.
  GraphRenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${GraphRenderFunctionName}
      RetentionInDays: 30

  GraphRenderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GraphRenderFunctionName}-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: hfy-graph-render
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${GraphRenderFunctionName}:*
              # Placeholder: logs only. viz-graph-cloud-source widens this (table read, photo reads, graph outputs) with the real package.

  GraphRenderFunction:
    Type: AWS::Lambda::Function
    DependsOn: GraphRenderLogGroup
    Properties:
      FunctionName: !Ref GraphRenderFunctionName
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Handler: src/index.handler
      Role: !GetAtt GraphRenderRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref GraphRenderCodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          SITE_BUCKET: !Ref MediaBucket

  # Break-glass writer for the data prefixes once the bucket-policy deny is on (BRD2 11.4, PS-05, SI-15). io only, MFA required, one hour.
  BreakGlassRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hfy-data-breakglass
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: sts:AssumeRole
            Condition:
              ArnEquals: { "aws:PrincipalArn": !Ref BreakGlassPrincipalArn }
              Bool: { "aws:MultiFactorAuthPresent": "true" }
      Policies:
        - PolicyName: hfy-data-breakglass
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DataPrefixes
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/person/*
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/family/*
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/event/*
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/note/*
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/place/*
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/media/*
              - Sid: DataPrefixList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${MediaBucket}
                Condition:
                  StringLike:
                    "s3:prefix": ["person/*", "family/*", "event/*", "note/*", "place/*", "media/*"]

Outputs:
  FunctionUrl: { Description: Lambda Function URL (CloudFront origin), Value: !GetAtt FunctionUrl.FunctionUrl }
  TableName: { Value: !Ref Table }
  FunctionName: { Value: !Ref Function }
  UploadsResponseHeadersPolicyId: { Description: "Response headers policy for the CloudFront /uploads/* behavior (scripts/infra/add-uploads-behavior.sh)", Value: !Ref UploadsResponseHeadersPolicy }
  AuthFunctionUrl: { Description: Auth edge Function URL (CloudFront origin for /auth/*), Value: !GetAtt AuthFunctionUrl.FunctionUrl }
  AuthFunctionName: { Value: !Ref AuthFunction }
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref UserPoolClient }
  SyncBucketName: { Value: !Ref SyncBucket }
  RenderFunctionArn: { Value: !GetAtt RenderFunction.Arn }
  RenderDlqUrl: { Value: !Ref RenderDlq }
  AlarmTopicArn: { Value: !Ref AlarmTopic }
  BreakGlassRoleArn: { Value: !GetAtt BreakGlassRole.Arn }
