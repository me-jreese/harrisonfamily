AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  harrisonfamily app backend (HFY-TSK-063, R32): DynamoDB table hfy-app, Lambda hfy-api behind an IAM-auth
  Function URL (AuthType NONE) used as a plain CloudFront custom origin, gated by the secret X-Origin-Verify header (HFY-R43).

Parameters:
  TableName: { Type: String, Default: hfy-app }
  FunctionName: { Type: String, Default: hfy-api }
  CodeBucket: { Type: String, Description: S3 bucket holding the hfy-api.zip package }
  CodeKey: { Type: String, Default: lambda/hfy-api.zip }
  ConfigBucket: { Type: String, Default: harrisonfamily, Description: Bucket with config/admins.json }
  MediaBucket: { Type: String, Default: harrisonfamily-frontend, Description: "Site bucket the API presigns post-photo uploads into (uploads/posts/*, never media/, which the ETL sync mirrors with --delete; HFY-R58) and reads person/<gramps_id>.json from for author display labels (read-only, HFY-R68). Not stack-managed: its CORS is a manual step, see media-bucket-cors.json" }
  MediaPublicBase: { Type: String, Default: "https://harrisonfamily.us", Description: "Origin that serves uploads/ (CloudFront /uploads/* behavior with UploadsResponseHeadersPolicy, scripts/infra/add-uploads-behavior.sh)" }
  AdminListKey: { Type: String, Default: config/admins.json }
  VapidSecretName: { Type: String, Default: "", Description: "Optional secret {subject,publicKey,privateKey} for web push; empty disables sending" }
  SessionIssuer: { Type: String, Default: "https://harrisonfamily.us/auth" }
  SessionAudience: { Type: String, Default: harrisonfamily-web }
  SessionJwksUrl: { Type: String, Default: "https://harrisonfamily.us/auth/.well-known/jwks.json", Description: Auth-edge JWKS the API verifies sessions with (HFY-R38; the API never holds the signing key) }
  SessionCookie: { Type: String, Default: io_id }
  # --- auth edge (HFY-TSK-062) ---
  AuthFunctionName: { Type: String, Default: hfy-auth-edge }
  AuthCodeKey: { Type: String, Default: lambda/hfy-auth-edge.zip, Description: Key of hfy-auth-edge.zip in CodeBucket }
  UserPoolName: { Type: String, Default: hfy-users }
  AllowlistKey: { Type: String, Default: config/userGrampsID.json, Description: Email -> gramps_id map the auth edge resolves principals against }
  SigningKeySecretName: { Type: String, Default: harrisonfamily/auth-edge/session-signing-key, Description: Secret created by scripts/infra/create-session-key.sh }
  McpRedirectUris: { Type: String, Default: "https://claude.ai/api/mcp/auth_callback,https://claude.com/api/mcp/auth_callback", Description: "HFY-TSK-076: comma-separated exact redirect URIs the public MCP client may use (the only allowed list)" }
  McpResources: { Type: String, Default: "https://harrisonfamily.us/mcp", Description: "HFY-TSK-076: comma-separated resource indicators (token aud); the first is the default" }
  McpCorsOrigins: { Type: String, Default: "https://claude.ai,https://claude.com", Description: "Exact browser origins allowed CORS on /auth/token, /register, /revoke (never a wildcard)" }
  SyncDesktopClient: { Type: String, Default: "0", AllowedValues: ["0", "1"], Description: "HFY-TSK-120 stack switch (default off): 1 registers the hfy-sync-desktop OAuth client (Gramps desktop add-on) on the auth edge. Turn on in the same change set as the sync routes (AC6 RG-4)" }
  OriginVerifySecretName: { Type: String, Default: harrisonfamily/cloudfront/origin-verify, Description: "Secret created by scripts/infra/create-origin-verify.sh; CloudFront sends it as X-Origin-Verify (HFY-R43)" }
  GoogleClientId: { Type: String, Description: Google OAuth web client id for GIS sign-in (public value) }
  SesIdentityArn: { Type: String, Default: "", Description: "Optional verified SES identity ARN (for example harrisonfamily.us, same region) for Cognito email. Empty keeps COGNITO_DEFAULT (about 50 emails/day for the account); the edge rate-limits /auth/password/forgot per email+IP either way" }
  SesFromAddress: { Type: String, Default: "", Description: "Optional From address when SesIdentityArn is set, for example: Harrison Family <no-reply@harrisonfamily.us>" }

Conditions:
  HasVapid: !Not [!Equals [!Ref VapidSecretName, ""]]
  HasSes: !Not [!Equals [!Ref SesIdentityArn, ""]]
  HasSesFrom: !And [!Condition HasSes, !Not [!Equals [!Ref SesFromAddress, ""]]]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: 30

  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${FunctionName}-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: hfy-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*
              - Sid: Table
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan, dynamodb:BatchGetItem, dynamodb:BatchWriteItem, dynamodb:ConditionCheckItem]
                Resource: [!GetAtt Table.Arn, !Sub "${Table.Arn}/index/*"]
              - Sid: AdminList
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ConfigBucket}/config/*
              # HFY-R58 (2): member uploads live under uploads/posts/<ulid>/ only; media/ belongs to the ETL sync (--delete).
              - Sid: PostPhotoUploads
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/uploads/posts/*
              # HFY-TSK-236 (BRD2 10.3): comment photos upload under uploads/comments/ only; never media/ or config/.
              - Sid: CommentPhotoUploads
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/uploads/comments/*
              # HFY-TSK-236: HEAD (size and type check) and copy source need s3:GetObject on the upload prefixes only.
              - Sid: UploadReads
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/uploads/comments/*
                  - !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/uploads/posts/*
              # HFY-R68: author labels are the person's displayName from the site's own record (never the allowlist email). Read-only, person/* only.
              - Sid: PersonRecords
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${MediaBucket}/person/*
              - !If
                - HasVapid
                - Sid: Secrets
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${VapidSecretName}-*
                - !Ref AWS::NoValue

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      Handler: src/index.handler
      Role: !GetAtt Role.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          SESSION_JWKS_URL: !Ref SessionJwksUrl
          ORIGIN_VERIFY: !Sub "{{resolve:secretsmanager:${OriginVerifySecretName}:SecretString}}"
          SESSION_ISSUER: !Ref SessionIssuer
          SESSION_AUDIENCE: !Ref SessionAudience
          SESSION_COOKIE: !Ref SessionCookie
          ADMIN_LIST_BUCKET: !Ref ConfigBucket
          ADMIN_LIST_KEY: !Ref AdminListKey
          MEDIA_BUCKET: !Ref MediaBucket
          MEDIA_PUBLIC_BASE: !Ref MediaPublicBase
          VAPID_SECRET: !If [HasVapid, !Ref VapidSecretName, !Ref "AWS::NoValue"]

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  # AuthType NONE: the URL is publicly invokable, so each Lambda rejects any request without the X-Origin-Verify secret (HFY-R43).
  InvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  InvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # HFY-R58 (2): attached to the CloudFront /uploads/* behavior by scripts/infra/add-uploads-behavior.sh (the public state, and what
  # add-data-gate-behaviors.sh --remove restores; the gated behavior uses hfy-uploads-private, same headers plus Cache-Control
  # private, no-store). Member uploads are served same-origin, so they are forced inert: no MIME sniffing, and a sandboxed CSP
  # that allows nothing but same-origin images.
  UploadsResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${FunctionName}-uploads-sandbox
        Comment: "harrisonfamily /uploads/*: nosniff + sandboxed CSP for member uploads (HFY-R58)"
        SecurityHeadersConfig:
          ContentTypeOptions: { Override: true }
          ContentSecurityPolicy:
            ContentSecurityPolicy: "sandbox; default-src 'none'; img-src 'self'"
            Override: true

  # ---------------- auth edge (HFY-TSK-062): Cognito pool + hfy-auth-edge at https://harrisonfamily.us/auth/* ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Ref UserPoolName
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      # HFY-R58 (5): no public SignUp. The edge provisions users with AdminCreateUser, and only after the allowlist check,
      # so a client-id holder cannot pre-register a family member's email with their own password.
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      # A changed email stays unverified (and the old one stays in effect) until the new address confirms its code.
      UserAttributeUpdateSettings: { AttributesRequireVerificationBeforeUpdate: [email] }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
      VerificationMessageTemplate: { DefaultEmailOption: CONFIRM_WITH_CODE }
      # COGNITO_DEFAULT caps account-wide email at about 50/day; set SesIdentityArn to send through SES instead (cognito-default-email-quota).
      EmailConfiguration: !If
        - HasSes
        - EmailSendingAccount: DEVELOPER
          SourceArn: !Ref SesIdentityArn
          From: !If [HasSesFrom, !Ref SesFromAddress, !Ref "AWS::NoValue"]
        - EmailSendingAccount: COGNITO_DEFAULT

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: hfy-web
      GenerateSecret: false
      # The edge, not the browser, calls Cognito (InitiateAuth USER_PASSWORD_AUTH) and then mints its own RS256 session.
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: [COGNITO]
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits: { RefreshToken: days, AccessToken: minutes, IdToken: minutes }

  AuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AuthFunctionName}
      RetentionInDays: 30

  AuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AuthFunctionName}-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: hfy-auth-edge
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AuthFunctionName}:*
              - Sid: RefreshAndLinkStore
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
                Resource: [!GetAtt Table.Arn, !Sub "${Table.Arn}/index/*"]
              - Sid: Allowlist
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ConfigBucket}/${AllowlistKey}
                  - !Sub arn:${AWS::Partition}:s3:::${ConfigBucket}/${AdminListKey}
              - Sid: SigningKey
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SigningKeySecretName}-*
              # The pool is AdminCreateUserOnly: auth/src/cognito.js creates users (after the allowlist check) and repairs any
              # pre-lockdown self-signed-up user (AdminConfirmSignUp, email_verified via AdminUpdateUserAttributes).
              - Sid: CognitoAdminLink
                Effect: Allow
                Action: [cognito-idp:AdminGetUser, cognito-idp:AdminCreateUser, cognito-idp:AdminSetUserPassword, cognito-idp:AdminConfirmSignUp, cognito-idp:AdminUpdateUserAttributes]
                Resource: !GetAtt UserPool.Arn

  AuthFunction:
    Type: AWS::Lambda::Function
    DependsOn: AuthLogGroup
    Properties:
      FunctionName: !Ref AuthFunctionName
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 15
      Handler: src/index.handler
      Role: !GetAtt AuthRole.Arn
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref AuthCodeKey }
      Environment:
        Variables:
          AUTH_TABLE: !Ref TableName
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          MCP_REDIRECT_URIS: !Ref McpRedirectUris
          MCP_RESOURCES: !Ref McpResources
          MCP_CORS_ORIGINS: !Ref McpCorsOrigins
          HFY_SYNC_DESKTOP_CLIENT: !Ref SyncDesktopClient
          ORIGIN_VERIFY: !Sub "{{resolve:secretsmanager:${OriginVerifySecretName}:SecretString}}"
          ADMIN_LIST_KEY: !Ref AdminListKey

  AuthFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AuthFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  AuthInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AuthInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl: { Description: Lambda Function URL (CloudFront origin), Value: !GetAtt FunctionUrl.FunctionUrl }
  TableName: { Value: !Ref Table }
  FunctionName: { Value: !Ref Function }
  UploadsResponseHeadersPolicyId: { Description: "Response headers policy for the CloudFront /uploads/* behavior (scripts/infra/add-uploads-behavior.sh)", Value: !Ref UploadsResponseHeadersPolicy }
  AuthFunctionUrl: { Description: Auth edge Function URL (CloudFront origin for /auth/*), Value: !GetAtt AuthFunctionUrl.FunctionUrl }
  AuthFunctionName: { Value: !Ref AuthFunction }
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref UserPoolClient }
